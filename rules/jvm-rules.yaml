# JVM Diagnostic Rules - Strict Note Mapping
# --- Branch: Container_cgroup_information ---

template_rules:
  # Check if JVM is the Container Root
  PID_1_CHECK:
    condition: "pid == 1"
    criticality: "INFO"
    message: "Process is PID 1. High container awareness required."

  # Ensure G1GC for modern RHEL/Data Grid environments
  GC_REQUIREMENT:
    condition: "not is_g1"
    criticality: "WARNING"
    message: "G1GC not detected in Template. Build: {version}."
    recommendation: "G1GC is recommended for optimal Data Grid garbage collection."

  # Check for Red Hat Build
  VENDOR_VALIDATION:
    condition: "not is_redhat"
    criticality: "NOTICE"
    message: "Non-Red Hat JRE detected: {version}."

# DRC Advisor v2.6 - JVM Check-up Rule Tree
vm_info_root:
  system_checks:
    rhel_os_compliance:
      condition: "OS contains 'Red Hat Enterprise Linux release 8'"
      sub_rules:
        thp_settings:
          condition: "THP == 'always' && Defrag == 'madvise'"
          crit: "WARNING"
          msg: "Performance Contention: THP 'always' on RHEL 8 can cause stall events. Recommended: 'madvise'."
    
    hugepage_alignment:
      condition: "AnonHugePages > 0"
      sub_rules:
        jvm_large_page_support:
          condition: "Large Page Support == 'Disabled'"
          crit: "CRITICAL"
          msg: "System has HugePages allocated but JVM is not using them. Enable -XX:+UseLargePages."

  runtime_checks:
    container_awareness:
      condition: "active_processor_count < CPUs_total"
      sub_rules:
        single_core_bottleneck:
          condition: "active_processor_count == 1"
          crit: "WARNING"
          msg: "JVM is constrained to a single core. G1GC and JIT compilation performance will be severely degraded."
    
    memory_utilization:
      condition: "MaxRAMPercentage > 0"
      sub_rules:
        pre_touch_validation:
          condition: "Pre-touch == 'Disabled' && HeapMaxCapacity > 1024"
          crit: "NOTICE"
          msg: "Large heap detected without Pre-Touch. Expect latency spikes during initial page commitment."

  agent_inspections:
    dynatrace_overhead:
      condition: "jvm_args contains 'oneagentjava'"
      crit: "NOTICE"
      msg: "OneAgent Active: Monitor CodeHeap 'non-nmethods' usage for instrumentation overhead."

cgroup_env:
  v1:
    condition: "cg_type == 'cgroupv1'"
    message: "cgroups v1"
  v2:
    condition: "cg_type == 'cgroupv2'"
    message: "cgroups v2"
  none:
    condition: "cg_type == 'N/A' or not cg_type"
    message: "not detected"

# --- Branch: Memory_Analysis (A/B Percentage) ---
memory_ratios:
  old_run_java:
    condition: "pcnt == 50"
    message: "50%: run-java.sh old openjdk images"
  new_run_java:
    condition: "pcnt == 80"
    message: "80%: run-java.sh new openjdk image"
  no_run_java:
    condition: "pcnt == 25"
    message: "25%: default OpenJDK, not using run-java.sh new openjdk image"
  custom_val:
    condition: "pcnt not in [25, 50, 80]"
    message: "{pcnt}%: custom - setting a custom value"

# --- Branch: container_cgroup_information (CPU) ---
cpu_logic:
  under_scaled_gc:
    condition: "cores >= 2 and workers == 1"
    message: "⚠️ CPU Under-utilization: {cores} cores available but only 1 GC worker."
  
# --- Branch: Metaspace_and_Class_Space ---
metaspace_logic:
  high_metaspace_usage:
    condition: "metaspace_used > 150"
    message: "High Metaspace usage: {metaspace_used}M. Check for classloader leaks."
  metaspace_optimal:
    condition: "metaspace_used <= 150"
    message: "Metaspace usage is within normal bounds."